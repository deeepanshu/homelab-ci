name: Komodo deploy

on:
  workflow_call:
    inputs:
      stack:
        description: Komodo stack name
        required: true
        type: string
      image_name:
        description: GHCR image without registry (e.g. deeepanshu/family-os-health-api)
        required: true
        type: string
      image_tag_variable:
        description: Komodo variable that compose interpolates as IMAGE_TAG
        required: true
        type: string
      image_path_regex:
        description: grep -E regex; matching paths trigger an image build
        required: true
        type: string
      deploy_path_regex:
        description: grep -E regex; matching paths trigger deploy without rebuild
        required: true
        type: string
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      registry:
        type: string
        default: ghcr.io
      platforms:
        type: string
        default: linux/amd64
      caller_event:
        description: github.event_name from the caller (push or workflow_dispatch)
        required: true
        type: string
      caller_before:
        description: github.event.before from the caller push
        required: false
        type: string
        default: ""
      image_tag:
        description: workflow_dispatch override; empty uses github.sha
        required: false
        type: string
        default: ""
    secrets:
      KOMODO_API_KEY:
        required: true
      KOMODO_API_SECRET:
        required: true
      NTFY_TOPIC:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: komodo-deploy-${{ inputs.stack }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Decide build vs deploy
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      deploy: ${{ steps.decide.outputs.deploy }}
      image_tag: ${{ steps.decide.outputs.image_tag }}
    steps:
      - name: Checkout
        if: inputs.caller_event == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changes
        id: decide
        env:
          EVENT_NAME: ${{ inputs.caller_event }}
          INPUT_TAG: ${{ inputs.image_tag }}
          BEFORE: ${{ inputs.caller_before }}
          IMAGE_RE: ${{ inputs.image_path_regex }}
          DEPLOY_RE: ${{ inputs.deploy_path_regex }}
        run: |
          set -euo pipefail
          build=false
          deploy=false
          tag="${GITHUB_SHA}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            deploy=true
            if [ -n "${INPUT_TAG}" ]; then
              tag="${INPUT_TAG}"
              echo "Manual deploy of existing tag ${tag} (no build)"
            else
              build=true
              echo "Manual rebuild of ${tag}"
            fi
          else
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              build=true
              deploy=true
            else
              CHANGED="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" || true)"
              echo "Changed files:"
              echo "${CHANGED}"
              FILTERED="$(printf '%s\n' "${CHANGED}" | grep -vE '\.mdx?$' || true)"
              if printf '%s\n' "${FILTERED}" | grep -qE "${IMAGE_RE}"; then
                build=true
                deploy=true
              elif printf '%s\n' "${FILTERED}" | grep -qE "${DEPLOY_RE}"; then
                deploy=true
                tag="main"
                echo "Compose/workflow only — deploy without rebuild"
              fi
            fi
          fi

          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Decision: build=${build} deploy=${deploy} image_tag=${tag}"

  build-and-push:
    name: Build and push amd64 image
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ needs.changes.outputs.image_tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.meta.outputs.tag }}
            ${{ inputs.registry }}/${{ inputs.image_name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via Komodo
    needs: [changes, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.changes.outputs.build != 'true' || needs.build-and-push.result == 'success') &&
      (github.ref == 'refs/heads/main' || inputs.caller_event == 'workflow_dispatch')
    steps:
      - name: Pin IMAGE_TAG and deploy stack
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag || needs.changes.outputs.image_tag }}
          STACK: ${{ inputs.stack }}
          TAG_VAR: ${{ inputs.image_tag_variable }}
        run: |
          set -euo pipefail
          if [ -z "${KOMODO_API_KEY}" ] || [ -z "${KOMODO_API_SECRET}" ]; then
            echo "Missing KOMODO_API_KEY or KOMODO_API_SECRET" >&2
            exit 1
          fi

          komodo() {
            local path="$1"
            local body="$2"
            curl -fsS --max-time 120 -X POST \
              "https://komodo.deepanshujain.me${path}" \
              -H "content-type: application/json" \
              -H "x-api-key: ${KOMODO_API_KEY}" \
              -H "x-api-secret: ${KOMODO_API_SECRET}" \
              -d "${body}"
            echo
          }

          if [ "${IMAGE_TAG}" != "main" ]; then
            echo "${TAG_VAR}=${IMAGE_TAG}"
            komodo /write "$(jq -nc --arg n "${TAG_VAR}" --arg v "${IMAGE_TAG}" \
              '{type:"UpdateVariableValue",params:{name:$n,value:$v}}')"
          else
            echo "Compose-only deploy; leaving ${TAG_VAR} unchanged"
          fi

          echo "DeployStack ${STACK}"
          komodo /execute "$(jq -nc --arg s "${STACK}" \
            '{type:"DeployStack",params:{stack:$s}}')"

  notify:
    name: ntfy
    needs: [changes, build-and-push, deploy]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (github.ref == 'refs/heads/main' || inputs.caller_event == 'workflow_dispatch')
    steps:
      - name: Publish ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUILD: ${{ needs.build-and-push.result }}
          DEPLOY: ${{ needs.deploy.result }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag || needs.changes.outputs.image_tag }}
          SHA: ${{ github.sha }}
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC secret not set; skipping"
            exit 0
          fi

          if [ "${DEPLOY}" = "success" ]; then
            status=success
            title="${STACK} deploy ok"
            prio=default
            tags="white_check_mark"
          elif [ "${BUILD}" = "failure" ]; then
            status=failed
            title="${STACK} image build failed"
            prio=high
            tags="x"
          else
            status=failed
            title="${STACK} deploy failed"
            prio=high
            tags="x"
          fi

          body="status=${status} tag=${IMAGE_TAG} sha=${SHA:0:12} build=${BUILD} deploy=${DEPLOY}"
          curl -fsS --max-time 15 -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: ${title}" \
            -H "Priority: ${prio}" \
            -H "Tags: ${tags}" \
            -H "Click: https://komodo.deepanshujain.me/" \
            -d "${body}"
          echo "ntfy ${status}"
